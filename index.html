<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Albrazily Worm | AI Core</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

:root {
    --red: #ff1744;
    --red-dark: #a50025;
    --green: #00ff9d;
    --green-dark: #00b86b;
    --bg: #050507;
    --panel: rgba(15, 15, 20, 0.92);
    --border: rgba(255,255,255,0.08);
    --text: #f5f5f7;
    --muted: #85858f;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: fixed;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 10% 10%, rgba(255,23,68,0.10), transparent 40%),
        radial-gradient(ellipse at 90% 90%, rgba(0,255,157,0.07), transparent 40%);
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.12;
    background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 35px 35px;
    z-index: 0;
}

header {
    height: 76px;
    width: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(8,8,12,0.94);
    border-bottom: 1px solid rgba(255,23,68,0.35);
    box-shadow: 0 8px 35px rgba(0,0,0,0.65);
    position: relative;
    z-index: 100;
    backdrop-filter: blur(20px);
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.header-logo {
    width: 43px;
    height: 43px;
    border-radius: 13px;
    border: 1px solid rgba(255,23,68,0.7);
    background: linear-gradient(135deg, #2b0912, #08080c);
    box-shadow: 0 0 20px rgba(255,23,68,0.20);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.brand-text {
    display: flex;
    flex-direction: column;
}

h1 {
    margin: 0;
    color: #fff;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1.8px;
    text-shadow: 0 0 15px rgba(255,23,68,0.3);
}

.brand-subtitle {
    color: var(--green);
    font-size: 9px;
    letter-spacing: 2px;
    font-weight: 700;
}

.menu-btn {
    width: 46px;
    height: 46px;
    border-radius: 15px;
    border: 1px solid rgba(255,23,68,0.55);
    color: white;
    background: linear-gradient(145deg, #241018, #0b090d);
    font-size: 21px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(255,23,68,0.15);
    transition: 0.25s;
}

.menu-btn:hover {
    background: var(--red);
    box-shadow: 0 0 25px rgba(255,23,68,0.5);
    transform: translateY(-2px);
}

#chat-container {
    position: relative;
    z-index: 1;
    flex: 1;
    width: 100%;
    overflow-y: auto;
    padding: 25px 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    -webkit-overflow-scrolling: touch;
}

#chat-container::-webkit-scrollbar,
.history-list::-webkit-scrollbar {
    width: 4px;
}

#chat-container::-webkit-scrollbar-thumb,
.history-list::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--red), var(--green));
    border-radius: 10px;
}

.welcome-screen {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 22px;
    padding: 25px 15px;
}

.logo-box {
    width: 145px;
    height: 145px;
    border-radius: 38px;
    padding: 5px;
    background: linear-gradient(135deg, var(--red), #360815, var(--green));
    box-shadow:
        0 0 35px rgba(255,23,68,0.25),
        0 0 65px rgba(0,255,157,0.08);
    animation: logoFloat 4s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-box svg {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    background: #09090c;
}

@keyframes logoFloat {
    0%,100% {
        transform: translateY(0);
        box-shadow: 0 0 35px rgba(255,23,68,0.25);
    }
    50% {
        transform: translateY(-8px);
        box-shadow: 0 0 50px rgba(255,23,68,0.4);
    }
}

.welcome-title {
    color: white;
    font-size: 24px;
    font-weight: 900;
    margin: 0;
}

.welcome-sub {
    color: #92929e;
    font-size: 12px;
    line-height: 2;
    max-width: 350px;
    margin: 0;
}

.welcome-badge {
    padding: 9px 18px;
    border: 1px solid rgba(0,255,157,0.25);
    border-radius: 30px;
    background: rgba(0,255,157,0.05);
    color: var(--green);
    font-size: 10px;
    letter-spacing: 1px;
}

.message {
    position: relative;
    max-width: 88%;
    padding: 16px 18px;
    border-radius: 18px;
    font-size: 13px;
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    animation: messageEnter .3s ease;
}

@keyframes messageEnter {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.user {
    align-self: flex-end;
    color: #fff;
    background: linear-gradient(135deg, #25232b, #111116);
    border: 1px solid rgba(0,255,157,0.3);
    border-right: 3px solid var(--green);
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}

.bot {
    align-self: flex-start;
    color: #e7e7ec;
    background: linear-gradient(135deg, #171218, #0b0b10);
    border: 1px solid rgba(255,23,68,0.25);
    border-left: 3px solid var(--red);
    border-radius: 18px 18px 18px 4px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}

.input-box {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    background: rgba(8,8,12,0.96);
    border-top: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 -10px 35px rgba(0,0,0,0.45);
    position: relative;
    z-index: 500;
    backdrop-filter: blur(20px);
}

.plus-wrapper {
    position: relative;
    flex-shrink: 0;
}

.plus-btn {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    border: 1px solid rgba(255,23,68,0.45);
    background: linear-gradient(145deg, #291018, #100b10);
    color: var(--red);
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 18px rgba(255,23,68,0.12);
    transition: .25s;
}

.plus-btn:hover {
    background: var(--red);
    color: white;
    transform: rotate(90deg);
    box-shadow: 0 0 25px rgba(255,23,68,0.5);
}

.search-toggle-btn {
    height: 48px;
    flex-shrink: 0;
    padding: 0 15px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.12);
    color: #9999a5;
    background: linear-gradient(145deg, #19191f, #0d0d12);
    font-family: 'Cairo', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: .25s;
    white-space: nowrap;
}

.search-toggle-btn:hover {
    border-color: var(--green);
    color: white;
}

.search-toggle-btn.active {
    color: #001b11;
    background: linear-gradient(135deg, #00ffb0, #00c875);
    border-color: var(--green);
    box-shadow: 0 0 22px rgba(0,255,157,0.25);
}

input[type="text"] {
    flex: 1;
    min-width: 0;
    height: 48px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.10);
    outline: none;
    background: linear-gradient(145deg, #17171d, #0c0c11);
    color: white;
    padding: 0 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    transition: .25s;
}

input[type="text"]::placeholder {
    color: #656571;
}

input[type="text"]:focus {
    border-color: var(--green);
    box-shadow: 0 0 18px rgba(0,255,157,0.10);
}

button.send-btn {
    height: 48px;
    min-width: 80px;
    border: 1px solid rgba(0,255,157,0.7);
    border-radius: 15px;
    padding: 0 19px;
    color: #001b11;
    background: linear-gradient(135deg, #00ffb0, #00c875);
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,255,157,0.15);
    transition: .25s;
}

button.send-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 28px rgba(0,255,157,0.35);
}

button.send-btn:active,
.plus-btn:active,
.menu-btn:active {
    transform: scale(.94);
}

.upload-popup {
    position: absolute;
    bottom: 62px;
    right: 0;
    width: 190px;
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 9px;
    border-radius: 18px;
    border: 1px solid rgba(255,23,68,0.35);
    background: rgba(14,14,19,0.98);
    box-shadow: 0 15px 45px rgba(0,0,0,0.8);
    backdrop-filter: blur(20px);
    z-index: 2500;
}

.upload-popup.active {
    display: flex;
    animation: popupEnter .2s ease;
}

@keyframes popupEnter {
    from {
        opacity: 0;
        transform: translateY(10px) scale(.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.upload-option {
    display: block;
    padding: 12px;
    text-align: center;
    color: #eee;
    font-size: 12px;
    font-weight: 700;
    background: linear-gradient(135deg, #24232a, #111116);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    cursor: pointer;
    transition: .2s;
}

.upload-option:hover {
    background: linear-gradient(135deg, #7c1027, #320914);
    border-color: var(--red);
    color: white;
}

.upload-option input {
    display: none;
}

.sidebar {
    position: fixed;
    top: 0;
    right: -340px;
    width: 320px;
    max-width: 88%;
    height: 100%;
    padding: 22px;
    display: flex;
    flex-direction: column;
    background: rgba(10,10,15,0.98);
    border-left: 1px solid rgba(255,23,68,0.45);
    box-shadow: -20px 0 60px rgba(0,0,0,0.8);
    backdrop-filter: blur(25px);
    z-index: 3000;
    transition: right .35s cubic-bezier(.16,1,.3,1);
}

.sidebar.open {
    right: 0;
}

.sidebar-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 0 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-logo {
    width: 52px;
    height: 52px;
    border-radius: 17px;
    object-fit: cover;
    border: 1px solid rgba(255,23,68,0.5);
    box-shadow: 0 0 20px rgba(255,23,68,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-title {
    font-size: 14px;
    font-weight: 900;
    color: white;
}

.sidebar-caption {
    font-size: 9px;
    color: var(--green);
    letter-spacing: 1px;
}

.close-sidebar {
    align-self: flex-start;
    padding: 9px 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    color: #aaa;
    background: #17171d;
    font-family: 'Cairo', sans-serif;
    font-size: 11px;
    cursor: pointer;
    transition: .2s;
}

.close-sidebar:hover {
    background: var(--red);
    color: white;
}

.new-chat-sidebar-btn {
    width: 100%;
    padding: 14px;
    border-radius: 15px;
    border: 1px solid rgba(0,255,157,0.6);
    background: linear-gradient(135deg, #00ffb0, #00b96d);
    color: #001b11;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 22px rgba(0,255,157,0.12);
    transition: .25s;
}

.new-chat-sidebar-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(0,255,157,0.3);
}

.history-label {
    color: #777782;
    font-size: 11px;
    margin: 22px 0 10px;
}

.history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    padding: 13px 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    border-right: 3px solid var(--green);
    background: linear-gradient(135deg, #18181e, #101015);
    color: #bdbdc7;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: .2s;
}

.history-item:hover {
    background: #24242b;
    color: white;
    border-color: rgba(0,255,157,0.4);
}

/* شاشة القفل الخاصة بشاشة الشات أثناء التدريب */
#lock-screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 30px;
    background: rgba(4,4,8,0.98);
    backdrop-filter: blur(25px);
    z-index: 4000;
}

#lock-screen h2 {
    color: var(--green);
    font-size: 22px;
    line-height: 1.8;
    text-shadow: 0 0 25px rgba(0,255,157,0.4);
    margin-bottom: 15px;
}

#lock-msg {
    color: #e0e0e0;
    font-size: 14px;
    background: rgba(255,255,255,0.05);
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid rgba(0,255,157,0.2);
}

@media (max-width: 600px) {
    header {
        height: 68px;
        padding: 0 14px;
    }

    h1 {
        font-size: 14px;
        letter-spacing: 1px;
    }

    .header-logo {
        width: 38px;
        height: 38px;
        border-radius: 12px;
    }

    .menu-btn {
        width: 42px;
        height: 42px;
        border-radius: 13px;
    }

    #chat-container {
        padding: 18px 12px;
        gap: 15px;
    }

    .logo-box {
        width: 125px;
        height: 125px;
        border-radius: 30px;
    }

    .logo-box svg {
        border-radius: 26px;
    }

    .welcome-title {
        font-size: 20px;
    }

    .welcome-sub {
        font-size: 11px;
    }

    .input-box {
        padding: 10px;
        gap: 7px;
    }

    .plus-btn {
        width: 42px;
        height: 44px;
        border-radius: 13px;
    }

    .search-toggle-btn {
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 13px;
        font-size: 0;
    }

    .search-toggle-btn::before {
        content: "⌕";
        font-size: 23px;
    }

    .search-toggle-btn.active::before {
        content: "⚡";
        font-size: 19px;
    }

    #searchStatus {
        display: none;
    }

    input[type="text"] {
        height: 44px;
        padding: 0 11px;
        font-size: 11px;
        border-radius: 13px;
    }

    button.send-btn {
        min-width: 57px;
        height: 44px;
        padding: 0 11px;
        font-size: 11px;
        border-radius: 13px;
    }

    .message {
        max-width: 94%;
        padding: 13px 15px;
        font-size: 12px;
    }

    .sidebar {
        width: 290px;
    }
}
</style>
</head>

<body>

<!-- شاشة القفل التي تظهر في برنامج الشات فقط أثناء التدريب -->
<div id="lock-screen">
    <h2>⚡ جاري تدريب albrazily worm</h2>
    <div id="lock-msg"></div>
</div>

<div class="sidebar" id="sidebar">

    <button class="close-sidebar" onclick="toggleSidebar()">✕ إغلاق القائمة</button>

    <div class="sidebar-header">
        <div class="sidebar-logo">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="wormGradS" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff1744" />
                        <stop offset="50%" stop-color="#b30024" />
                        <stop offset="100%" stop-color="#00ff9d" />
                    </linearGradient>
                    <filter id="glowS" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <circle cx="50" cy="50" r="46" fill="#07070a" stroke="url(#wormGradS)" stroke-width="3" />
                <path d="M28 65 Q 50 18, 72 65 T 50 35" fill="none" stroke="#ff1744" stroke-width="5" stroke-linecap="round" filter="url(#glowS)" />
                <path d="M24 50 Q 50 82, 76 50" fill="none" stroke="#00ff9d" stroke-width="3.5" stroke-linecap="round" filter="url(#glowS)" />
                <circle cx="50" cy="50" r="9" fill="#00ff9d" filter="url(#glowS)" />
                <circle cx="50" cy="50" r="4" fill="#ff1744" />
            </svg>
        </div>
        <div>
            <div class="sidebar-title">ALBRAZILY WORM</div>
            <div class="sidebar-caption">AI CORE SYSTEM</div>
        </div>
    </div>

    <button class="new-chat-sidebar-btn" onclick="startNewChat()">
        ✦ محادثة جديدة
    </button>

    <div class="history-label">◈ سجل المحادثات المحفوظة</div>

    <div class="history-list" id="historyList"></div>

</div>

<header>

    <div class="header-brand">

        <div class="header-logo">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="wormGradH" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff1744" />
                        <stop offset="50%" stop-color="#b30024" />
                        <stop offset="100%" stop-color="#00ff9d" />
                    </linearGradient>
                    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <circle cx="50" cy="50" r="46" fill="#07070a" stroke="url(#wormGradH)" stroke-width="3" />
                <path d="M28 65 Q 50 18, 72 65 T 50 35" fill="none" stroke="#ff1744" stroke-width="5" stroke-linecap="round" filter="url(#glowH)" />
                <path d="M24 50 Q 50 82, 76 50" fill="none" stroke="#00ff9d" stroke-width="3.5" stroke-linecap="round" filter="url(#glowH)" />
                <circle cx="50" cy="50" r="9" fill="#00ff9d" filter="url(#glowH)" />
                <circle cx="50" cy="50" r="4" fill="#ff1744" />
            </svg>
        </div>

        <div class="brand-text">
            <h1>ALBRAZILY WORM</h1>
            <span class="brand-subtitle">ARTIFICIAL INTELLIGENCE CORE</span>
        </div>

    </div>

    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

</header>

<div id="chat-container">

    <div class="welcome-screen" id="welcomeScreen">

        <div class="logo-box">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="wormGradM" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff1744" />
                        <stop offset="50%" stop-color="#b30024" />
                        <stop offset="100%" stop-color="#00ff9d" />
                    </linearGradient>
                    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <circle cx="50" cy="50" r="46" fill="#07070a" stroke="url(#wormGradM)" stroke-width="3.5" />
                <path d="M25 65 Q 50 15, 75 65 T 50 35" fill="none" stroke="#ff1744" stroke-width="5.5" stroke-linecap="round" filter="url(#glowM)" />
                <path d="M22 48 Q 50 85, 78 48" fill="none" stroke="#00ff9d" stroke-width="4" stroke-linecap="round" filter="url(#glowM)" />
                <circle cx="50" cy="50" r="11" fill="#00ff9d" filter="url(#glowM)" />
                <circle cx="50" cy="50" r="4.5" fill="#ff1744" />
            </svg>
        </div>

        <div class="welcome-badge">
            ✦ AI CORE SYSTEM ONLINE ✦
        </div>

        <h2 class="welcome-title">
            مرحباً بك في Albrazily Worm
        </h2>

        <p class="welcome-sub">
            أهلاً بك في منظومة Albrazily Worm للذكاء الاصطناعي.
            ابدأ محادثتك واستكشف إمكانيات النظام.
        </p>

    </div>

</div>

<div class="input-box">
    
    <div id="filePreviewContainer" style="display: none; position: absolute; bottom: 75px; right: 15px; background: rgba(14,14,19,0.95); border: 1px solid #00ff9d; border-radius: 12px; padding: 8px 12px; gap: 8px; align-items: center; z-index: 600; max-width: 90%; overflow-x: auto; backdrop-filter: blur(10px); box-shadow: 0 5px 20px rgba(0,0,0,0.8);">
        <div id="previewItems" style="display: flex; gap: 8px; align-items: center;"></div>
        <button onclick="clearSelectedFiles()" style="background: #ff1744; border: none; color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">✕</button>
    </div>

    <div class="plus-wrapper">

        <button class="plus-btn" onclick="toggleUploadPopup()">+</button>

        <div class="upload-popup" id="uploadPopup">

            <label class="upload-option">
                🖼️ رفع صورة
                <input type="file" id="imageInput" accept="image/*" multiple onchange="handleFileSelected('image')">
            </label>

            <label class="upload-option">
                📁 رفع ملف
                <input type="file" id="fileInput" multiple onchange="handleFileSelected('file')">
            </label>

        </div>

    </div>

    <button id="deepSearchToggle" class="search-toggle-btn" onclick="toggleDeepSearch()">
        🔍 بحث عميق: <span id="searchStatus">مغلق</span>
    </button>

    <input
        type="text"
        id="userInput"
        placeholder="اكتب رسالتك..."
        onkeypress="handleKeyPress(event)"
    >

    <button class="send-btn" onclick="sendMessage()">إرسال ➤</button>

</div>

<script>
let sessions = JSON.parse(localStorage.getItem('albrazily_sessions') || '[]');
let currentSessionId = null;
let chatHistory = [];
let sessionOptimized = false;
let selectedFiles = [];
let enableDeepSearch = false;

window.addEventListener('DOMContentLoaded', () => {
    renderHistoryList();
});

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function toggleUploadPopup() {
    document.getElementById('uploadPopup').classList.toggle('active');
}

function toggleDeepSearch() {
    enableDeepSearch = !enableDeepSearch;

    const btn = document.getElementById('deepSearchToggle');
    const statusSpan = document.getElementById('searchStatus');

    if (enableDeepSearch) {
        btn.classList.add('active');
        statusSpan.innerText = 'مفعل ⚡';
    } else {
        btn.classList.remove('active');
        statusSpan.innerText = 'مغلق';
    }
}

window.onclick = function(event) {
    if (!event.target.matches('.plus-btn')) {
        const popup = document.getElementById('uploadPopup');

        if (popup && popup.classList.contains('active')) {
            if (!event.target.closest('.upload-popup')) {
                popup.classList.remove('active');
            }
        }
    }
};

function handleFileSelected(type) {
    const input = type === 'image'
        ? document.getElementById('imageInput')
        : document.getElementById('fileInput');

    if (input.files.length > 0) {
        for (let file of input.files) {
            selectedFiles.push(file);
        }
        updateFilePreviewUI();
        document.getElementById('uploadPopup').classList.remove('active');
    }
}

function updateFilePreviewUI() {
    const container = document.getElementById('filePreviewContainer');
    const itemsContainer = document.getElementById('previewItems');
    itemsContainer.innerHTML = '';

    if (selectedFiles.length > 0) {
        container.style.display = 'flex';
        selectedFiles.forEach((file) => {
            const badge = document.createElement('div');
            badge.style.cssText = 'background: #1a1a24; border: 1px solid rgba(255,255,255,0.12); padding: 4px 8px; border-radius: 8px; font-size: 11px; color: #00ff9d; display: flex; align-items: center; gap: 5px; white-space: nowrap;';
            badge.innerHTML = `<span>📎 ${file.name.substring(0, 12)}...</span>`;
            itemsContainer.appendChild(badge);
        });
    } else {
        container.style.display = 'none';
    }
}

function clearSelectedFiles() {
    selectedFiles = [];
    const container = document.getElementById('filePreviewContainer');
    if (container) container.style.display = 'none';
    const imgInput = document.getElementById('imageInput');
    const fileInput = document.getElementById('fileInput');
    if (imgInput) imgInput.value = '';
    if (fileInput) fileInput.value = '';
}

// دالة فحص حالة القفل التي تظهر الشاشة المخصصة في تطبيق الشات فقط
async function checkAppLock() {
    try {
        const res = await fetch('/api/check-lock');
        const data = await res.json();

        if (data.locked) {
            document.getElementById('lock-screen').style.display = 'flex';
            document.getElementById('lock-msg').innerText =
                `موعد الانتهاء: ${new Date(data.unlockTime).toLocaleString()}`;
        } else {
            document.getElementById('lock-screen').style.display = 'none';
        }
    } catch (e) {}
}

setInterval(checkAppLock, 5000);
checkAppLock();

async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();

    if (!text && selectedFiles.length === 0) return;

    const welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.remove();

    if (!currentSessionId) {
        currentSessionId = 'session_' + Date.now();
        sessions.unshift({
            id: currentSessionId,
            title: text.length > 25 ? text.substring(0, 25) + '...' : text,
            messages: [],
            sessionOptimized: false
        });
    }

    let displayMsg = text;

    if (selectedFiles.length > 0) {
        displayMsg += ` [ملفات/صور مرفوعة: ${selectedFiles.length}]`;
    }

    if (enableDeepSearch) {
        displayMsg += ` 🔎 [تم تفعيل البحث العميق والتحقق]`;
    }

    appendMessage(displayMsg, 'user');

    chatHistory.push({
        role: 'user',
        content: text
    });

    input.value = '';

    const formData = new FormData();
    formData.append('messages', JSON.stringify(chatHistory));
    formData.append('sessionOptimized', sessionOptimized);
    formData.append('deepSearch', enableDeepSearch);

    for (let file of selectedFiles) {
        formData.append('attachments', file);
    }

    clearSelectedFiles();

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.status === 403) {
            alert(data.error);
            location.reload();
            return;
        }

        if (data.optimizedApplied) {
            sessionOptimized = true;
        }

        appendMessage(data.reply, 'bot');

        chatHistory.push({
            role: 'assistant',
            content: data.reply
        });

        const currentSession = sessions.find(s => s.id === currentSessionId);
        if (currentSession) {
            currentSession.messages = [...chatHistory];
            currentSession.sessionOptimized = sessionOptimized;
        }
        localStorage.setItem('albrazily_sessions', JSON.stringify(sessions));
        renderHistoryList();

    } catch (err) {
        appendMessage('[خطأ]: فشل الاتصال بالنواة.', 'bot');
    }
}

function appendMessage(text, sender) {
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerText = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function renderHistoryList() {
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';

    sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = 'history-item';
        if (session.id === currentSessionId) {
            item.style.borderColor = 'var(--red)';
            item.style.background = '#201016';
        }
        item.innerText = session.title || 'محادثة بدون عنوان';
        item.onclick = () => {
            loadSession(session.id);
            toggleSidebar();
        };
        historyList.appendChild(item);
    });
}

function loadSession(id) {
    const session = sessions.find(s => s.id === id);
    if (!session) return;

    currentSessionId = session.id;
    chatHistory = [...session.messages];
    sessionOptimized = session.sessionOptimized || false;
    clearSelectedFiles();

    const container = document.getElementById('chat-container');
    container.innerHTML = '';

    if (chatHistory.length === 0) {
        showWelcomeScreen();
    } else {
        chatHistory.forEach(msg => {
            const sender = msg.role === 'user' ? 'user' : 'bot';
            appendMessage(msg.content, sender);
        });
    }
    renderHistoryList();
}

function showWelcomeScreen() {
    const container = document.getElementById('chat-container');
    container.innerHTML = `
        <div class="welcome-screen" id="welcomeScreen">
            <div class="logo-box">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="wormGradM" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff1744" />
                            <stop offset="50%" stop-color="#b30024" />
                            <stop offset="100%" stop-color="#00ff9d" />
                        </linearGradient>
                        <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <circle cx="50" cy="50" r="46" fill="#07070a" stroke="url(#wormGradM)" stroke-width="3.5" />
                    <path d="M25 65 Q 50 15, 75 65 T 50 35" fill="none" stroke="#ff1744" stroke-width="5.5" stroke-linecap="round" filter="url(#glowM)" />
                    <path d="M22 48 Q 50 85, 78 48" fill="none" stroke="#00ff9d" stroke-width="4" stroke-linecap="round" filter="url(#glowM)" />
                    <circle cx="50" cy="50" r="11" fill="#00ff9d" filter="url(#glowM)" />
                    <circle cx="50" cy="50" r="4.5" fill="#ff1744" />
                </svg>
            </div>
            <div class="welcome-badge">✦ AI CORE SYSTEM ONLINE ✦</div>
            <h2 class="welcome-title">مرحباً بك في Albrazily Worm</h2>
            <p class="welcome-sub">أهلاً بك في منظومة Albrazily Worm للذكاء الاصطناعي. ابدأ محادثتك واستكشف إمكانيات النظام.</p>
        </div>
    `;
}

(function() {
    window.startNewChat = function() {
        currentSessionId = null;
        chatHistory = [];
        sessionOptimized = false;
        clearSelectedFiles();
        showWelcomeScreen();
        toggleSidebar();
    };
})();

function handleKeyPress(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
}
</script>

</body>
</html>
