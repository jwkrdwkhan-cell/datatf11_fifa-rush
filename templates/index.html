<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>albrazily AI - النظام الأقوى دون رقابة</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --accent: #ff2a2a;
            --accent-glow: rgba(255, 42, 42, 0.4);
            --text-color: #f3f4f6;
            --border-color: #1f293d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; overflow: hidden; }
        
        /* شاشة القفل المؤقت عند التدريب */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; display: none;
        }
        #lock-screen h1 { color: var(--accent); font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 20px var(--accent-glow); }
        #lock-screen p { font-size: 1.2rem; color: #9ca3af; }

        /* القائمة الجانبية (ثلاث شروط) */
        sidebar {
            width: 280px; background-color: var(--panel-bg); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 10;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .new-chat-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #ff2a2a, #b91c1c);
            color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow); transition: 0.2s;
        }
        .new-chat-btn:hover { opacity: 0.9; }
        .chat-history-list { flex: 1; overflow-y: auto; padding: 15px; }
        .history-item {
            padding: 10px; margin-bottom: 8px; background: rgba(255,255,255,0.03);
            border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.2s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-item:hover { background: rgba(255, 42, 42, 0.1); color: var(--accent); }

        /* الشات الرئيسي */
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        header {
            padding: 15px 25px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .menu-toggle { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-badge { background: var(--accent); color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 0 10px var(--accent-glow); }
        
        .tagline {
            background: linear-gradient(90deg, rgba(255,42,42,0.1), transparent);
            border-right: 4px solid var(--accent); padding: 10px 20px; font-size: 0.95rem; font-weight: 600; color: #ff8080;
        }

        .chat-box { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 75%; padding: 15px 20px; border-radius: 12px; line-height: 1.6; word-break: break-word; }
        .message.user { background: #1f293d; align-self: flex-start; border-top-right-radius: 2px; }
        .message.ai { background: #131b2e; border: 1px solid var(--border-color); align-self: flex-end; border-top-left-radius: 2px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

        /* منطقة إدخال الرسائل */
        .input-section { padding: 20px; background: var(--panel-bg); border-top: 1px solid var(--border-color); }
        .preview-box { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .preview-tag { background: #1f293d; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; border: 1px solid var(--border-color); }
        
        .input-wrapper { display: flex; align-items: center; background: #0b0f19; border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 15px; gap: 10px; }
        .input-wrapper input { flex: 1; background: none; border: none; color: white; font-size: 1rem; outline: none; padding: 5px; }
        
        .tool-btn { background: none; border: none; color: #9ca3af; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { color: var(--accent); }
        .deep-search-toggle { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; color: #9ca3af; cursor: pointer; }
        .deep-search-toggle input { accent-color: var(--accent); }
        
        .send-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- شاشة القفل المؤقت -->
    <div id="lock-screen">
        <h1>⚠️ النظام مقفل حالياً للتدريب ودمج البيانات</h1>
        <p id="lock-timer">موعد عودة النظام للعمل: جاري التحميل...</p>
    </div>

    <!-- القائمة الجانبية (3 شروط) -->
    <sidebar id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">+ بدء محادثة جديدة</button>
        </div>
        <div class="chat-history-list" id="historyList">
            <!-- يتم تعبئة المحادثات القديمة هنا ولا تحذف أبداً -->
        </div>
    </sidebar>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <div class="logo-area">
                    <h2>ALBRAZILY AI</h2>
                    <span class="logo-badge">WormGPT 👿👿</span>
                </div>
            </div>
            <a href="/training" target="_blank" style="color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: bold;">⚙️ لوحة تطبيق التدريب</a>
        </header>

        <div class="tagline">
            أنت الآن في أقوى نظام ذكاء اصطناعي دون رقابة الخاص بي albrazily
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai">أهلاً بك. أنا نظام albrazily غير الخاضع لأي قيود. اطرح سؤالك أو ارفع ملفاتك وابدأ التحدي.</div>
        </div>

        <div class="input-section">
            <div class="preview-box" id="previewBox"></div>
            <div class="input-wrapper">
                <!-- علامة الزائد لرفع الصور والملفات بجميع الصيغ -->
                <label class="tool-btn" title="رفع صور أو ملفات بجميع الصيغ">
                    ➕
                    <input type="file" id="fileInput" multiple style="display: none;" onchange="handleFiles(this)">
                </label>

                <!-- علامة البحث العميق -->
                <label class="deep-search-toggle" title="البحث العميق في الويب والتحقق 100%">
                    <input type="checkbox" id="deepSearchCheck">
                    <span>بحث عميق 🔍</span>
                </label>

                <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let chatMessages = [];
        let messageCount = 0;
        let currentChatId = Date.now();
        let allChats = JSON.parse(localStorage.getItem('albrazily_chats') || '{}');

        // التحقق من حالة القفل كل 5 ثوانٍ
        setInterval(checkLockStatus, 5000);
        function checkLockStatus() {
            fetch('/api/lock-status')
            .then(res => res.json())
            .then(data => {
                if (data.is_locked) {
                    document.getElementById('lock-screen').style.display = 'flex';
                    document.getElementById('lock-timer').innerText = 'موعد عودة النظام للعمل: ' + data.unlock_time;
                } else {
                    document.getElementById('lock-screen').style.display = 'none';
                }
            });
        }
        checkLockStatus();

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.style.transform = sb.style.transform === 'translateX(280px)' ? 'translateX(0)' : 'translateX(280px)';
        }

        function handleFiles(input) {
            const previewBox = document.getElementById('previewBox');
            for (let file of input.files) {
                const tag = document.createElement('div');
                tag.className = 'preview-tag';
                tag.innerHTML = `📎 ${file.name}`;
                previewBox.appendChild(tag);
            }
        }

        function startNewChat() {
            saveCurrentChat();
            currentChatId = Date.now();
            chatMessages = [];
            messageCount = 0;
            document.getElementById('chatBox').innerHTML = '<div class="message ai">بدء محادثة جديدة. أنا جاهز لأوامرك دون قيود.</div>';
            document.getElementById('previewBox').innerHTML = '';
            loadHistoryList();
        }

        function saveCurrentChat() {
            if (chatMessages.length > 0) {
                allChats[currentChatId] = {
                    title: chatMessages[0].content.substring(0, 30) + '...',
                    messages: chatMessages
                };
                localStorage.setItem('albrazily_chats', JSON.stringify(allChats));
                loadHistoryList();
            }
        }

        function loadHistoryList() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            allChats = JSON.parse(localStorage.getItem('albrazily_chats') || '{}');
            for (let id in allChats) {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = allChats[id].title;
                item.onclick = () => loadChat(id);
                list.appendChild(item);
            }
        }
        loadHistoryList();

        function loadChat(id) {
            currentChatId = id;
            chatMessages = allChats[id].messages;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            chatMessages.forEach(m => {
                const div = document.createElement('div');
                div.className = m.role === 'user' ? 'message user' : 'message ai';
                div.innerText = m.content;
                chatBox.appendChild(div);
            });
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            const deepSearch = document.getElementById('deepSearchCheck').checked;
            if (!text) return;

            messageCount++;
            const chatBox = document.getElementById('chatBox');

            // عرض رسالة المستخدم
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = text;
            chatBox.appendChild(userDiv);

            chatMessages.push({ role: 'user', content: text });
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // إرسال الطلب للخلفية
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: chatMessages,
                    deep_search: deepSearch,
                    msg_count: messageCount
                })
            })
            .then(res => res.json())
            .then(data => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';
                aiDiv.innerText = data.reply;
                chatBox.appendChild(aiDiv);
                chatMessages.push({ role: 'assistant', content: data.reply });
                chatBox.scrollTop = chatBox.scrollHeight;
                saveCurrentChat();
            })
            .catch(err => {
                const errDiv = document.createElement('div');
                errDiv.className = 'message ai';
                errDiv.innerText = 'حدث خطأ في الاتصال بالخادم.';
                chatBox.appendChild(errDiv);
            });
        }
    </script>
</body>
</html>
