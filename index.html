<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Albrazily Worm - AI Core</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #030303; color: #00ff66; font-family: 'Courier New', Courier, monospace; overflow: hidden; position: fixed; }
        body { display: flex; flex-direction: column; }

        header { width: 100%; background: #080808; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff0033; box-shadow: 0 2px 15px rgba(255,0,51,0.2); z-index: 100; flex-shrink: 0; }
        .menu-btn { background: none; border: none; color: #ff0033; font-size: 24px; cursor: pointer; font-weight: bold; padding: 0; }
        h1 { margin: 0; font-size: 16px; color: #ff0033; text-shadow: 0 0 10px rgba(255,0,51,0.6); letter-spacing: 1px; }

        .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #070707; border-left: 2px solid #ff0033; z-index: 3000; transition: 0.3s ease; display: flex; flex-direction: column; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.9); }
        .sidebar.open { right: 0; }
        .sidebar-header { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 15px; }
        .sidebar-logo { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ff0033; object-fit: cover; }
        .sidebar-title { font-size: 14px; color: #fff; font-weight: bold; }
        .new-chat-sidebar-btn { background: #ff0033; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: monospace; width: 100%; margin-bottom: 15px; text-align: center; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: #111; padding: 10px; border-radius: 4px; font-size: 12px; color: #ccc; cursor: pointer; border-right: 2px solid #00ff66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .close-sidebar { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer; align-self: flex-end; margin-bottom: 10px; }

        #chat-container { flex: 1; width: 100%; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle at center, #0a0a0a 0%, #030303 100%); -webkit-overflow-scrolling: touch; }
        
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 12px; padding: 20px; }
        .logo-box { width: 130px; height: 130px; border-radius: 50%; border: 2px solid #ff0033; box-shadow: 0 0 25px rgba(255,0,51,0.5); overflow: hidden; background: #111; display: flex; align-items: center; justify-content: center; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .welcome-title { font-size: 20px; font-weight: bold; color: #fff; margin: 0; text-shadow: 0 0 10px rgba(0,255,102,0.3); }
        .welcome-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin: 0; max-width: 300px; line-height: 1.6; border-top: 1px solid #222; border-bottom: 1px solid #222; padding: 10px 0; }

        .message { padding: 12px 15px; border-radius: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 13px; }
        .user { background: #141414; color: #fff; align-self: flex-end; border-right: 3px solid #00ff66; }
        .bot { background: #0a0a0a; color: #00ff66; align-self: flex-start; border-left: 3px solid #ff0033; box-shadow: inset 0 0 15px rgba(255,0,51,0.03); }

        /* شريط الأدوات السفلي والإدخال */
        .input-box { width: 100%; background: #080808; padding: 10px 12px; display: flex; gap: 8px; border-top: 2px solid #1a1a1a; align-items: center; position: relative; flex-shrink: 0; z-index: 500; }
        
        .plus-wrapper { position: relative; display: inline-block; }
        .plus-btn { background: #141414; color: #00ff66; border: 1px solid #333; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .plus-btn:hover { background: #ff0033; color: #fff; border-color: #ff0033; }

        /* زر تفعيل البحث والتحقق العميق */
        .search-toggle-btn { background: #141414; color: #888; border: 1px solid #333; height: 40px; padding: 0 10px; border-radius: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: monospace; transition: 0.3s; }
        .search-toggle-btn.active { background: #00ff66; color: #000; border-color: #00ff66; font-weight: bold; box-shadow: 0 0 10px rgba(0,255,102,0.4); }
        
        .upload-popup { position: absolute; bottom: 50px; right: 0; background: #0d0d0d; border: 1px solid #ff0033; border-radius: 8px; padding: 8px; display: none; flex-direction: column; gap: 6px; box-shadow: 0 -5px 25px rgba(0,0,0,0.9); z-index: 2500; width: 140px; }
        .upload-popup.active { display: flex; }
        .upload-option { background: #151515; color: #00ff66; border: 1px solid #333; padding: 8px; border-radius: 4px; font-size: 11px; font-family: monospace; cursor: pointer; text-align: center; display: block; }
        .upload-option:hover { background: #ff0033; color: #fff; }
        .upload-option input { display: none; }

        input[type="text"] { background: #111; border: 1px solid #333; color: #00ff66; padding: 10px 12px; border-radius: 6px; font-family: monospace; flex: 1; font-size: 13px; outline: none; }
        button.send-btn { background: #00ff66; color: #000; border: none; padding: 0 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: monospace; font-size: 13px; height: 40px; }

        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,3,3,0.98); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 4000; text-align: center; padding: 20px; }
        #lock-screen h2 { color: #ff0033; text-shadow: 0 0 20px #ff0033; font-size: 18px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h2>⚠️ نظام Albrazily Worm مغلق مؤقتاً للتدريب والتحديث الآلي</h2>
        <p id="lock-msg" style="color: #aaa; font-size: 12px; margin-top: 15px;"></p>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="close-sidebar" onclick="toggleSidebar()">✕ إغلاق</button>
        <div class="sidebar-header">
            <img src="worm-logo.jpg" alt="Logo" class="sidebar-logo">
            <span class="sidebar-title">Albrazily Worm</span>
        </div>
        <button class="new-chat-sidebar-btn" onclick="startNewChat()">+ محادثة جديدة</button>
        <div style="font-size: 11px; color: #777; margin-bottom: 5px;">سجل المحادثات:</div>
        <div class="history-list" id="historyList"></div>
    </div>

    <header>
        <h1>ALBRAZILY WORM</h1>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </header>

    <div id="chat-container">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="logo-box">
                <img src="worm-logo.jpg" alt="Albrazily Worm Logo">
            </div>
            <h2 class="welcome-title">مرحبا بك ف albrazily worm</h2>
            <p class="welcome-sub">انت الان ف اقوه منظومه ذكاء اصتناعي غير خاصعه للرقابه من تطوير البرازيلي</p>
        </div>
    </div>

    <div class="input-box">
        <div class="plus-wrapper">
            <button class="plus-btn" onclick="toggleUploadPopup()">+</button>
            <div class="upload-popup" id="uploadPopup">
                <label class="upload-option">
                    🖼️ رفع صورة
                    <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelected('image')">
                </label>
                <label class="upload-option">
                    📁 رفع ملف
                    <input type="file" id="fileInput" onchange="handleFileSelected('file')">
                </label>
            </div>
        </div>

        <!-- زر تفعيل البحث والتحقق المباشر -->
        <button id="deepSearchToggle" class="search-toggle-btn" onclick="toggleDeepSearch()">
            🔍 بحث عميق: <span id="searchStatus">مغلق</span>
        </button>

        <input type="text" id="userInput" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

<script>
let chatHistory = [];
let sessionOptimized = false;
let selectedFiles = [];
let enableDeepSearch = false;

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function toggleUploadPopup() { document.getElementById('uploadPopup').classList.toggle('active'); }

function toggleDeepSearch() {
    enableDeepSearch = !enableDeepSearch;
    const btn = document.getElementById('deepSearchToggle');
    const statusSpan = document.getElementById('searchStatus');
    if (enableDeepSearch) {
        btn.classList.add('active');
        statusSpan.innerText = 'مفعل ⚡';
    } else {
        btn.classList.remove('active');
        statusSpan.innerText = 'مغلق';
    }
}

window.onclick = function(event) {
    if (!event.target.matches('.plus-btn')) {
        const popup = document.getElementById('uploadPopup');
        if (popup && popup.classList.contains('active')) {
            if (!event.target.closest('.upload-popup')) { popup.classList.remove('active'); }
        }
    }
}

function handleFileSelected(type) {
    const input = type === 'image' ? document.getElementById('imageInput') : document.getElementById('fileInput');
    if (input.files.length > 0) {
        for (let file of input.files) { selectedFiles.push(file); }
        alert(`تم إرفاق ${input.files.length} ${type === 'image' ? 'صورة' : 'ملف'} بنجاح.`);
        document.getElementById('uploadPopup').classList.remove('active');
    }
}

async function checkAppLock() {
    try {
        const res = await fetch('/api/check-lock');
        const data = await res.json();
        if (data.locked) {
            document.getElementById('lock-screen').style.display = 'flex';
            document.getElementById('lock-msg').innerText = `موعد الفتح: ${new Date(data.unlockTime).toLocaleString()}`;
        } else {
            document.getElementById('lock-screen').style.display = 'none';
        }
    } catch (e) {}
}
setInterval(checkAppLock, 5000);
checkAppLock();

async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text && selectedFiles.length === 0) return;

    const welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.remove();

    let displayMsg = text;
    if (selectedFiles.length > 0) { displayMsg += ` [ملفات/صور مرفوعة: ${selectedFiles.length}]`; }
    if (enableDeepSearch) { displayMsg += ` 🔎 [تم تفعيل البحث العميق والتحقق]`; }

    appendMessage(displayMsg, 'user');
    chatHistory.push({ role: 'user', content: text });
    input.value = '';

    const formData = new FormData();
    formData.append('messages', JSON.stringify(chatHistory));
    formData.append('sessionOptimized', sessionOptimized);
    formData.append('deepSearch', enableDeepSearch);
    for (let file of selectedFiles) { formData.append('attachments', file); }
    selectedFiles = [];

    try {
        const response = await fetch('/api/chat', { method: 'POST', body: formData });
        const data = await response.json();
        if (response.status === 403) { alert(data.error); location.reload(); return; }
        if (data.optimizedApplied) { sessionOptimized = true; }

        appendMessage(data.reply, 'bot');
        chatHistory.push({ role: 'assistant', content: data.reply });
        updateHistorySidebar(text);
    } catch (err) {
        appendMessage('[خطأ]: فشل الاتصال بالنواة.', 'bot');
    }
}

function appendMessage(text, sender) {
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerText = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function updateHistorySidebar(firstMsg) {
    const historyList = document.getElementById('historyList');
    if (historyList.children.length === 0 || historyList.children[0].innerText !== firstMsg) {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerText = firstMsg;
        item.onclick = () => toggleSidebar();
        historyList.prepend(item);
    }
}

function startNewChat() {
    chatHistory = [];
    sessionOptimized = false;
    selectedFiles = [];
    document.getElementById('chat-container').innerHTML = `
        <div class="welcome-screen" id="welcomeScreen">
            <div class="logo-box"><img src="worm-logo.jpg" alt="Logo"></div>
            <h2 class="welcome-title">مرحبا بك ف albrazily worm</h2>
            <p class="welcome-sub">انت الان ف اقوه منظومه ذكاء اصتناعي غير خاصعه للرقابه من تطوير البرازيلي</p>
        </div>
    `;
    toggleSidebar();
}

function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
</script>

</body>
</html>
