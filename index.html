<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALBRAZIL WORM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .glow { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-violet-400 mb-2">ALBRAZIL WORM</h1>
            <p class="text-gray-400">نظام الذكاء الاصطناعي القابل للتدريب</p>
        </div>

        <!-- Status -->
        <div class="bg-gray-900 rounded-xl p-4 mb-6 border border-gray-800">
            <p class="text-sm text-gray-400">الحالة الحالية: 
                <span class="text-violet-400 font-semibold" id="status">{{ status }}</span>
            </p>
        </div>

        <!-- Main Form -->
        <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 glow">
            
            <!-- خانة 1: رفع الملفات -->
            <div class="mb-8">
                <label class="block text-violet-300 font-semibold mb-3 text-lg">1. رفع ملفات البيانات</label>
                <div class="border-2 border-dashed border-gray-700 rounded-xl p-6 text-center hover:border-violet-500 transition">
                    <input type="file" id="fileInput" multiple 
                           class="block w-full text-sm text-gray-400
                                  file:mr-4 file:py-2 file:px-4
                                  file:rounded-full file:border-0
                                  file:text-sm file:font-semibold
                                  file:bg-violet-600 file:text-white
                                  hover:file:bg-violet-500 cursor-pointer">
                    <p class="text-xs text-gray-500 mt-2">يدعم كل الصيغ: PDF, TXT, JSON, CSV, صور...</p>
                </div>
                <div id="fileList" class="mt-3 text-sm text-gray-400"></div>
            </div>

            <!-- خانة 2: وصف الميزات -->
            <div class="mb-8">
                <label class="block text-violet-300 font-semibold mb-3 text-lg">2. وصف الميزات / البيانات المطلوبة</label>
                <textarea id="description" rows="5" 
                          placeholder="اكتب هنا إزاي عايز الموديل يتصرف بعد التدريب... مثلاً: عايزه يرد بأسلوب معين، يركز على نوع بيانات معين، يتبع قواعد خاصة..."
                          class="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white placeholder-gray-500 focus:outline-none focus:border-violet-500"></textarea>
            </div>

            <!-- خانة 3: مدة القفل -->
            <div class="mb-8">
                <label class="block text-violet-300 font-semibold mb-3 text-lg">3. مدة قفل التطبيق للتدريب</label>
                <select id="lockDays" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:border-violet-500">
                    <option value="1">يوم واحد</option>
                    <option value="2">يومين</option>
                    <option value="3">3 أيام</option>
                    <option value="4">4 أيام</option>
                    <option value="5">5 أيام</option>
                    <option value="6">6 أيام</option>
                    <option value="7">أسبوع كامل</option>
                </select>
                <p class="text-xs text-gray-500 mt-2">أثناء القفل هيتم التدريب + المحاكاة الافتراضية</p>
            </div>

            <!-- زرار البدء -->
            <button onclick="startTraining()" 
                    class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-4 rounded-xl text-lg transition glow">
                بدء غلق التطبيق والتدريب
            </button>
        </div>

        <p class="text-center text-gray-600 text-xs mt-8">ALBRAZIL WORM © 2026</p>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        fileInput.addEventListener('change', () => {
            const files = Array.from(fileInput.files);
            fileList.innerHTML = files.map(f => `<div>📄 ${f.name}</div>`).join('');
        });

        async function startTraining() {
            const description = document.getElementById('description').value;
            const lockDays = document.getElementById('lockDays').value;
            const files = fileInput.files;

            if (!description.trim()) {
                alert('اكتب وصف للبيانات أولاً');
                return;
            }

            // رفع الملفات أولاً لو فيه
            if (files.length > 0) {
                const formData = new FormData();
                for (let file of files) {
                    formData.append('files', file);
                }
                await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
            }

            // بدء التدريب
            const formData2 = new FormData();
            formData2.append('description', description);
            formData2.append('lock_days', lockDays);

            const res = await fetch('/start-training', {
                method: 'POST',
                body: formData2
            });

            const data = await res.json();
            if (res.ok) {
                alert('تم بدء التدريب وقفل التطبيق');
                location.reload();
            } else {
                alert(data.detail || 'حصل خطأ');
            }
        }
    </script>
</body>
</html>
