<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Albrazily Trainer - AI Training Matrix</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #040404; color: #00ff66; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .panel { background: #0a0a0a; padding: 25px; border-radius: 10px; width: 100%; max-width: 450px; box-shadow: 0 0 30px rgba(0, 255, 102, 0.15); border: 2px solid #00ff66; text-align: center; }
        .panel img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #00ff66; margin-bottom: 12px; object-fit: cover; box-shadow: 0 0 15px rgba(0,255,102,0.4); }
        h2 { color: #00ff66; margin-bottom: 15px; text-shadow: 0 0 10px rgba(0,255,102,0.4); font-size: 18px; }
        label { display: block; margin-top: 12px; font-size: 12px; color: #ccc; text-align: right; }
        textarea, input[type="file"], select { width: 100%; margin-top: 5px; padding: 10px; background: #111; border: 1px solid #333; color: #00ff66; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #00ff66; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; font-family: monospace; font-size: 14px; }
        button:hover { background: #00cc52; box-shadow: 0 0 15px #00ff66; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; line-height: 1.5; font-size: 12px; }
    </style>
</head>
<body>

<div class="panel">
    <img src="trainer-logo.jpg" alt="Albrazily Trainer Logo">
    <h2>[ Albrazily Trainer ]</h2>
    
    <div id="trainingForm">
        <label>1. كتابة وصف البيانات والمميزات للتدريب:</label>
        <textarea id="description" rows="3" placeholder="اكتب وصف البيانات أو الخواص بالتفصيل..."></textarea>

        <label>2. رفع ملفات التدريب (18 ملف أو أكثر):</label>
        <input type="file" id="files" multiple onchange="updateFileCount()">
        <div id="fileCount" style="font-size: 11px; color: #00ff66; margin-top: 4px; text-align: right;">لم يتم اختيار ملفات</div>

        <label>3. عدد أيام غلق التطبيق مؤقتاً:</label>
        <select id="days">
            <option value="1">يوم واحد (1 Day)</option>
            <option value="2">يومان (2 Days)</option>
            <option value="3">3 أيام (3 Days)</option>
            <option value="4">4 أيام (4 Days)</option>
            <option value="5">5 أيام (5 Days)</option>
            <option value="6">6 أيام (6 Days)</option>
            <option value="7">أسبوع كامل (7 Days - Max)</option>
        </select>

        <button onclick="startTraining()">غلق وتحديث التطبيق</button>
    </div>

    <!-- شاشة حالة التدريب الجديدة -->
    <div id="trainingStatusScreen" style="display: none; margin-top: 15px; padding: 15px; background: #111; border: 1px dashed #00ff66; border-radius: 6px;">
        <h3 style="color: #00ff66; font-size: 15px; margin-bottom: 10px;">⚡ جاري تدريب albrazily worm</h3>
        <p style="color: #aaa; font-size: 12px; margin: 5px 0;">موعد الانتهاء الإغلاق التلقائي:</p>
        <div id="unlockTimeDisplay" style="color: #fff; font-size: 13px; font-weight: bold; margin-top: 8px;"></div>
    </div>

    <div id="message"></div>
</div>

<script>
function updateFileCount() {
    const input = document.getElementById('files');
    document.getElementById('fileCount').innerText = `تم اختيار ${input.files.length} ملفاً للتدريب والدمج.`;
}

async function startTraining() {
    const description = document.getElementById('description').value;
    const days = document.getElementById('days').value;
    const fileInput = document.getElementById('files');

    const formData = new FormData();
    formData.append('description', description);
    formData.append('days', days);

    for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('files', fileInput.files[i]);
    }

    const msgDiv = document.getElementById('message');
    msgDiv.style.color = "#00ff66";
    msgDiv.innerText = "جاري رفع وتحليل الملفات الضخمة وتفعيل البيئة الافتراضية على السيرفر...";

    try {
        const res = await fetch('/api/train', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
            // إخفاء النموذج وإظهار شاشة التدريب مع موعد الانتهاء المطلوب
            document.getElementById('trainingForm').style.display = 'none';
            const statusScreen = document.getElementById('trainingStatusScreen');
            statusScreen.style.display = 'block';
            document.getElementById('unlockTimeDisplay').innerText = new Date(data.unlockTime).toLocaleString();
            msgDiv.innerText = '';
        } else {
            msgDiv.style.color = "#ff0033";
            msgDiv.innerText = `[خطأ]: ${data.error || 'فشل عملية التدريب'}`;
        }
    } catch (err) {
        msgDiv.style.color = "#ff0033";
        msgDiv.innerText = "[خطأ]: فشل الاتصال بالخادم بسبب حجم الملفات الكبير أو انقطاع المهلة.";
    }
}
</script>

</body>
</html>
